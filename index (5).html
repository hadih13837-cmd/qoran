<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3b37">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جزء سی">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="حفظ جزء سی قرآن با آزمون صوتی و نمایش پیشرفت هر سوره">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>حفظ جزء سی</title>
<style>
/* Layout: a phone-first app. A teal hero with an eight-point-star lattice opens the home page; surahs are cards led by a star medallion whose fill shows progress; a bottom tab bar switches Home, Surahs and Progress; the exam page swaps the tab bar for a floating mic tray. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#14262a; --muted:#53686d; --line:#d3dddb;
  --accent:#0d5a53; --accent-ink:#ffffff; --accent-soft:#dfeeea;
  --gold:#8a6518; --ok:#1b7447; --warn:#b4511a;
  --hero-a:#0a3b37; --hero-b:#11625a; --hero-ink:#eef6f3; --hero-gold:#ecd085;
  --font-ui:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-quran:'Amiri Quran','Amiri','Scheherazade New','Noto Naskh Arabic','Traditional Arabic',serif;
  --q-size:1.8rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1517; --surface:#122125; --ink:#e5eeec; --muted:#94a9ad; --line:#23383d;
    --accent:#4cbcab; --accent-ink:#04211d; --accent-soft:#163338;
    --gold:#d5b05a; --ok:#5ccf8e; --warn:#f2a574;
    --hero-a:#072a2b; --hero-b:#0b4744; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1517; --surface:#122125; --ink:#e5eeec; --muted:#94a9ad; --line:#23383d;
  --accent:#4cbcab; --accent-ink:#04211d; --accent-soft:#163338;
  --gold:#d5b05a; --ok:#5ccf8e; --warn:#f2a574;
  --hero-a:#072a2b; --hero-b:#0b4744; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 16px/1.6 var(--font-ui);
  padding-block:10px 12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:640px;margin-inline:auto;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 22px);display:flex;flex-direction:column}
.wrap.has-nav{padding-bottom:84px}
#page{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ar{font-family:var(--font-quran);font-size:var(--q-size);line-height:2;text-align:right;direction:rtl;overflow-wrap:anywhere}
h1,h2,h3,p{margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:1px solid var(--line);background:transparent;border-radius:12px;cursor:pointer;font-size:.92rem;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.block{width:100%}
.link{background:none;border:none;padding:4px 8px;color:var(--accent);font-size:.88rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.icon-btn svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* cards, bars */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.sec{font-size:1rem;font-weight:700;margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);width:0}
.bar.done i{background:var(--gold)}
.credit{text-align:center;color:var(--muted);font-size:.78rem;padding:6px 0}

/* medallion */
.medal{flex:none}
.medal rect{fill:var(--surface);stroke:var(--gold);stroke-width:1.6}
.medal text{font-family:var(--font-ui);font-weight:700;font-size:13px;fill:var(--gold)}
.medal[data-s="1"] rect{fill:var(--accent-soft);stroke:var(--accent)}
.medal[data-s="1"] text{fill:var(--accent)}
.medal[data-s="2"] rect{fill:var(--gold);stroke:var(--gold)}
.medal[data-s="2"] text{fill:var(--bg)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 20px 60px;color:var(--hero-ink);background:linear-gradient(160deg,var(--hero-a),var(--hero-b));text-align:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.9;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 44 44'><g fill='none' stroke='%23ecd085' stroke-opacity='.22' stroke-width='1'><rect x='9' y='9' width='26' height='26'/><rect x='9' y='9' width='26' height='26' transform='rotate(45 22 22)'/></g></svg>");
  -webkit-mask-image:linear-gradient(to bottom,#000 20%,transparent 100%);mask-image:linear-gradient(to bottom,#000 20%,transparent 100%)}
.hero-kicker{font-size:.85rem;letter-spacing:.04em;color:var(--hero-gold);font-weight:500}
.hero-ar{font-family:var(--font-quran);font-weight:400;font-size:clamp(2.4rem,11vw,3.3rem);line-height:2;margin-top:10px;color:var(--hero-gold)}
.hero-sub{font-size:.92rem;opacity:.9}
.stats{margin-top:-38px;position:relative;display:flex;gap:16px;align-items:center}
.ring{flex:none;position:relative;width:104px;height:104px}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.35rem;font-weight:800;color:var(--accent)}
.stat-lines{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-lines .big{font-size:1.15rem;font-weight:700}

/* continue card */
.cont{display:flex;flex-direction:column;gap:12px}
.cont-top{display:flex;gap:14px;align-items:center}
.cont-top .titles{min-width:0;flex:1}
.cont-ar{font-family:var(--font-quran);font-size:1.7rem;line-height:1.7;direction:rtl;text-align:right}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;padding-inline:2px}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;text-decoration:none;font-size:.88rem}
.chip small{color:var(--muted)}

/* surah list */
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.page-title{font-size:1.4rem;font-weight:800}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:1rem}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.85rem;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.scard{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-decoration:none}
.scard .s-main{flex:1;min-width:0}
.s-ar{font-family:var(--font-quran);font-size:1.45rem;line-height:1.7;direction:rtl;text-align:right}
.s-fa{font-size:.82rem;color:var(--muted)}
.s-prog{flex:none;width:84px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.s-num{font-size:.8rem;font-weight:700;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

/* top bar (sub pages) */
.topbar{display:flex;align-items:center;gap:12px;padding-top:4px}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-size:1.1rem;line-height:1.3}
.topbar .t span{font-size:.82rem;color:var(--muted)}

/* surah header */
.shead{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.shead .big-ar{font-family:var(--font-quran);font-size:clamp(2rem,9vw,2.6rem);line-height:1.7;color:var(--accent)}
.shead .bar{width:100%}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sizer{display:flex;gap:6px}
.sizer button{min-width:44px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:700}
.sizer button:disabled{opacity:.4;cursor:default}
.bsm{text-align:center;color:var(--gold);padding:4px 0 2px}

/* verse rows */
.verses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);border-radius:14px}
.verses .row:last-child{border-bottom:none}
.num{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.read.hide .slot{filter:blur(9px);transition:filter .2s;cursor:pointer}
.read.hide .row.shown .slot{filter:none}

.exam .row{border-bottom:none;padding:8px 8px}
.exam .slot{min-height:calc(var(--q-size)*2);border-bottom:2px dotted var(--line);display:flex;align-items:center}
.exam [data-state="current"]{background:var(--accent-soft)}
.exam [data-state="current"] .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exam [data-state="current"] .slot{border-bottom-color:var(--accent)}
.exam [data-state="ok"] .slot,.exam [data-state="peek"] .slot,.exam [data-state="known"] .slot{border-bottom-color:transparent;display:block}
.exam [data-state="ok"] .num{background:var(--gold);color:var(--bg)}
.exam [data-state="peek"] .num{border-style:dashed}
.exam [data-state="peek"] .slot{opacity:.65}
.exam [data-state="known"] .num{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.exam [data-state="known"] .slot{opacity:.7}
.ghost{color:var(--muted);opacity:.75}
.pop{animation:rise .45s ease-out}
.shake{animation:shake .35s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}

.done{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.done h2{font-size:1.25rem;color:var(--accent)}
.done p{color:var(--muted)}
.done .acts{flex-wrap:wrap;justify-content:center}

/* progress page */
.bigring{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bigring .ring{width:148px;height:148px}
.bigring .ring svg{width:148px;height:148px}
.bigring .ring b{font-size:1.9rem}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.counts div{padding:10px 4px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.counts b{display:block;font-size:1.25rem}
.counts span{font-size:.78rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.gcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;text-align:center}
.gcell b{font-size:.82rem;font-weight:500}
.gcell span{font-size:.72rem;color:var(--muted)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--gold);margin-inline-end:5px;vertical-align:-1px}
.legend i.p{border-color:var(--accent);background:var(--accent-soft)}
.legend i.d{background:var(--gold)}
.confirm{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.confirm .acts{width:100%}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:640px;gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:.78rem;font-weight:500}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}

/* exam tray */
.tray{position:sticky;bottom:8px;z-index:5;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(0,0,0,.16);margin-top:8px}
.status{text-align:center;font-size:.92rem;color:var(--muted);min-height:1.5em}
.status[data-tone="warn"]{color:var(--warn)}
.status[data-tone="ok"]{color:var(--ok);font-weight:500}
.heard{min-height:2.4rem;text-align:center;font-family:var(--font-quran);font-size:1.3rem;line-height:1.9;direction:rtl;unicode-bidi:plaintext;overflow-wrap:anywhere}
.ctrls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.mic{width:68px;height:68px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.mic:disabled{background:var(--line);color:var(--muted);cursor:default}
.mic .i-stop{display:none}
.mic[data-state="on"] .i-mic,.mic[data-state="wait"] .i-mic{display:none}
.mic[data-state="on"] .i-stop,.mic[data-state="wait"] .i-stop{display:block}
.mic[data-state="on"]{animation:ring 1.6s ease-out infinite}
.mic[data-state="wait"]{opacity:.7}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-family:var(--font-quran);font-size:1.25rem;direction:rtl}

/* permission gate */
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,15,17,.55);
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 20px 18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 48px rgba(0,0,0,.3)}
.gate-icon{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.gate-card h2{font-size:1.25rem}
.gate-card p{color:var(--muted);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.pop,.shake,.mic[data-state="on"]{animation:none}}
</style>

<style>
@font-face{font-family:'Amiri';src:url('fonts/amiri-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
.install{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.install p{margin:0;color:var(--muted);font-size:.88rem}
.ibar{position:fixed;z-index:15;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ibar-card{pointer-events:auto;width:100%;max-width:608px;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.22);animation:ibar-in .35s ease-out}
.ibar-head{display:flex;gap:12px;align-items:center}
.ibar-head img{width:48px;height:48px;border-radius:12px;flex:none}
.ibar-head b{display:block;font-size:1rem}
.ibar-head span{display:block;font-size:.84rem;color:var(--muted);line-height:1.5}
.ibar-acts{display:flex;gap:8px}
.ibar-acts .btn{flex:1}
@keyframes ibar-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ibar-card{animation:none}}
</style>
<style id="v2">
/* v2 look: bright airy ground, one hue per surah (set as --h on each element), orange/pink challenge and blue/violet free-play cards. Tokens below override the first palette. */
:root{
  --bg:#f3f6ff; --surface:#ffffff; --ink:#172033; --muted:#566079; --line:#dbe1f2;
  --accent:#0b7f73; --accent-ink:#ffffff; --accent-soft:#d9f4ef;
  --gold:#9a6a00; --ok:#12803f; --warn:#c2410c; --fire:#c2410c;
  --hero-a:#0b8f8a; --hero-b:#3f6fe0; --hero-ink:#ffffff; --hero-gold:#ffe58a;
  --tint-l:95%; --tint2-l:86%; --stroke-l:42%; --solid-l:40%; --txt-l:26%;
  --card-s:90%; --card-l:97%; --card-line-l:88%; --solid-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1220; --surface:#161d30; --ink:#e8ecf8; --muted:#9aa5c4; --line:#27304a;
    --accent:#3dd6c3; --accent-ink:#04211d; --accent-soft:#14323a;
    --gold:#f2c14e; --ok:#5ccf8e; --warn:#f2a574; --fire:#ff9a5c;
    --hero-a:#0a4d57; --hero-b:#243b8a; --hero-ink:#ffffff; --hero-gold:#ffe58a;
    --tint-l:21%; --tint2-l:31%; --stroke-l:62%; --solid-l:56%; --txt-l:88%;
    --card-s:35%; --card-l:15%; --card-line-l:26%; --solid-ink:#0b1020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#161d30; --ink:#e8ecf8; --muted:#9aa5c4; --line:#27304a;
  --accent:#3dd6c3; --accent-ink:#04211d; --accent-soft:#14323a;
  --gold:#f2c14e; --ok:#5ccf8e; --warn:#f2a574; --fire:#ff9a5c;
  --hero-a:#0a4d57; --hero-b:#243b8a; --hero-ink:#ffffff; --hero-gold:#ffe58a;
  --tint-l:21%; --tint2-l:31%; --stroke-l:62%; --solid-l:56%; --txt-l:88%;
  --card-s:35%; --card-l:15%; --card-line-l:26%; --solid-ink:#0b1020;
  color-scheme:dark;
}

/* icons */
.ic{width:20px;height:20px;fill:currentColor;flex:none}
.ics{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* medallions: a colour per surah */
.medal rect{fill:hsl(var(--h,200) 90% var(--tint-l));stroke:hsl(var(--h,200) 70% var(--stroke-l));stroke-width:1.8}
.medal text{fill:hsl(var(--h,200) 70% var(--txt-l))}
.medal[data-s="1"] rect{fill:hsl(var(--h,200) 90% var(--tint2-l))}
.medal[data-s="2"] rect{fill:hsl(var(--h,200) 75% var(--solid-l));stroke:hsl(var(--h,200) 75% var(--solid-l))}
.medal[data-s="2"] text{fill:var(--solid-ink)}

/* surah cards and progress grid */
.scard{background:hsl(var(--h,200) var(--card-s) var(--card-l));border-color:hsl(var(--h,200) 60% var(--card-line-l));border-radius:20px}
.gcell{background:hsl(var(--h,200) var(--card-s) var(--card-l));border-color:hsl(var(--h,200) 60% var(--card-line-l));border-radius:18px}
.scard .bar i,.gcell .bar i{background:hsl(var(--h,200) 75% var(--solid-l))}
.scard .bar.done i{background:var(--gold)}
.scard .bar{background:hsl(var(--h,200) 40% var(--card-line-l))}
.s-ar{color:var(--ink)}

/* hero */
.hero{background:
  radial-gradient(circle at 12% 18%,rgba(255,214,102,.38),transparent 42%),
  radial-gradient(circle at 92% 86%,rgba(255,110,170,.38),transparent 46%),
  radial-gradient(circle at 80% 8%,rgba(120,240,200,.30),transparent 38%),
  linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.hero-kicker{color:var(--hero-ink);opacity:.95;font-weight:700}
.hero-sub{opacity:1}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#2563eb))}

/* bottom nav: four tabs, each with its own hue */
.nav-in{grid-template-columns:repeat(4,1fr)}
#n-home{--h:175}#n-surahs{--h:205}#n-challenge{--h:24}#n-progress{--h:275}
.nav a{color:var(--muted)}
.nav a[aria-current="page"]{background:hsl(var(--h) 90% var(--tint-l));color:hsl(var(--h) 70% var(--txt-l))}
.nav a svg{stroke-width:2.1}

/* home challenge card */
.hcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#d9480f,#b5179e)}
.hcard .hc-ic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.hcard .hc-ic .ic{width:26px;height:26px}
.hcard b{display:block;font-size:1.05rem}
.hcard span{display:block;font-size:.85rem;opacity:.95}
.hcard .go{margin-inline-start:auto;font-weight:800;font-size:.9rem;padding:7px 12px;border-radius:999px;background:#fff;color:#7c2d12;flex:none}

/* challenge menu */
.lvl{display:flex;gap:14px;align-items:center}
.lvl-badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#f59e0b,#e11d48);color:#fff;font-weight:800;font-size:1.6rem;flex:none}
.lvl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lvl-main b{font-size:1.1rem}
.xpbar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#e11d48);border-radius:5px}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--fire)}
.streak .ic{width:24px;height:24px}
.dcard,.fcard{border-radius:24px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:10px}
.dcard{background:linear-gradient(135deg,#d9480f,#b5179e)}
.fcard{background:linear-gradient(135deg,#1d6fe0,#6d28d9)}
.dcard h2,.fcard h2{font-size:1.25rem}
.dcard p,.fcard p{font-size:.92rem;opacity:.97}
.dcard .meta,.fcard .meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-size:.8rem;font-weight:700}
.tag .ic{width:15px;height:15px}
.btn.light{background:#fff;border-color:#fff;color:#4a1d96;font-weight:800}
.dcard .btn.light{color:#7c2d12}
.btn.light[aria-disabled="true"]{opacity:.75;pointer-events:none}
.fcard .pill{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff}
.fcard .pill[aria-pressed="true"]{background:#fff;color:#4a1d96;border-color:#fff}
.fcard .pill:disabled{opacity:.5}
.scope{display:flex;gap:8px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;background:hsl(var(--h) 90% var(--tint-l));text-align:center;font-size:.78rem;line-height:1.4}
.badge b{font-size:.82rem}
.badge svg{width:32px;height:32px;fill:hsl(var(--h) 70% var(--stroke-l))}
.badge.locked{filter:grayscale(1);opacity:.5}
.badge span{color:var(--muted)}

/* in-game */
#play{display:flex;flex-direction:column;gap:14px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.hud-mid{font-weight:700;flex:1;text-align:center}
.hud-r{display:flex;align-items:center;gap:8px}
.hearts{display:flex;gap:2px;color:#e11d48}
.hearts .off{color:var(--line)}
.chipk{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:.92rem;color:var(--fire)}
.tbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;border-radius:5px;background:hsl(120 80% 42%)}
.qcard{display:flex;flex-direction:column;gap:12px;text-align:center}
.qprompt{font-weight:800;font-size:1.1rem}
.qtext{text-align:center;direction:rtl;font-size:calc(var(--q-size)*.95)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px;border:2px solid hsl(var(--h) 70% 78%);background:hsl(var(--h) 90% var(--tint-l));border-radius:18px;cursor:pointer;text-align:right;color:var(--ink)}
.opt .l{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:12px;background:hsl(var(--h) 75% var(--solid-l));color:var(--solid-ink);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.opt.ar-t .tx{font-family:var(--font-quran);font-size:1.5rem;line-height:1.9;direction:rtl;font-weight:400}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--surface))}
.opt.bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,var(--surface));animation:shake .35s}
.fb{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.fb[data-ok="1"]{border-color:var(--ok)}
.fb[data-ok="0"]{border-color:var(--warn)}
.fbt{font-weight:800}
.fb[data-ok="1"] .fbt{color:var(--ok)}
.fb[data-ok="0"] .fbt{color:var(--warn)}
.fbi{color:var(--muted);font-size:.9rem}
.fbar{font-family:var(--font-quran);font-size:1.35rem;line-height:1.9;direction:rtl;text-align:right}

/* result */
.res{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-top:10px}
.res h1{font-size:1.5rem}
.stars{display:flex;gap:6px}
.stars svg{width:52px;height:52px;fill:var(--line)}
.stars svg.on{fill:#f5b301;animation:rise .5s ease-out both}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rstats div{padding:12px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rstats b{display:block;font-size:1.3rem}
.rstats span{font-size:.78rem;color:var(--muted)}
.lvup{padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#e11d48);color:#fff;font-weight:800;font-size:.9rem}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(560deg)}}

/* audio player */
.player{display:flex;flex-direction:column;gap:10px}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pl-top b{display:block}
.pl-play{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#1d6fe0,#6d28d9);flex:none}
.pl-play:disabled{background:var(--line);color:var(--muted);cursor:default}
.pl-play .ic{width:26px;height:26px}
.pl-play .pl-i-pause{display:none}
.pl-play[data-on="1"] .pl-i-pause{display:block}
.pl-play[data-on="1"] .pl-i-play{display:none}
.pl-bar{display:flex;flex-direction:column;gap:4px}
.pl-bar input[type=range]{width:100%;direction:ltr;accent-color:#6d28d9}
.pl-time{display:flex;justify-content:space-between;direction:ltr;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pl-opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.stars svg.on{animation:none}}
</style>

اهِدٍ وَمَشْهُودٍ","قُتِلَ أَصْحَٰبُ ٱلْأُخْدُودِ","ٱلنَّارِ ذَاتِ ٱلْوَقُودِ","إِذْ هُمْ عَلَيْهَا قُعُودٌ","وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌ","وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ","ٱلَّذِى لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ شَهِيدٌ","إِنَّ ٱلَّذِينَ فَتَنُوا۟ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ثُمَّ لَمْ يَتُوبُوا۟ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ ٱلْحَرِيقِ","إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ جَنَّٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ذَٰلِكَ ٱلْفَوْزُ ٱلْكَبِيرُ","إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ","إِنَّهُۥ هُوَ يُبْدِئُ وَيُعِيدُ","وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ","ذُو ٱلْعَرْشِ ٱلْمَجِيدُ","فَعَّالٌ لِّمَا يُرِيدُ","هَلْ أَتَىٰكَ حَدِيثُ ٱلْجُنُودِ","فِرْعَوْنَ وَثَمُودَ","بَلِ ٱلَّذِينَ كَفَرُوا۟ فِى تَكْذِيبٍ","وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطٌۢ","بَلْ هُوَ قُرْءَانٌ مَّجِيدٌ","فِى لَوْحٍ مَّحْفُوظٍۭ"]},{"id":86,"ar":"ٱلطَّارِقِ","fa":"طارق","v":["وَٱلسَّمَآءِ وَٱلطَّارِقِ","وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ","ٱلنَّجْمُ ٱلثَّاقِبُ","إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ","فَلْيَنظُرِ ٱلْإِنسَٰنُ مِمَّ خُلِقَ","خُلِقَ مِن مَّآءٍ دَافِقٍ","يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ","إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌ","يَوْمَ تُبْلَى ٱلسَّرَآئِرُ","فَمَا لَهُۥ مِن قُوَّةٍ وَلَا نَاصِرٍ","وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ","وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ","إِنَّهُۥ لَقَوْلٌ فَصْلٌ","وَمَا هُوَ بِٱلْهَزْلِ","إِنَّهُمْ يَكِيدُونَ كَيْدًا","وَأَكِيدُ كَيْدًا","فَمَهِّلِ ٱلْكَٰفِرِينَ أَمْهِلْهُمْ رُوَيْدًۢا"]},{"id":87,"ar":"ٱلْأَعْلَىٰ","fa":"اعلی","v":["سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى","ٱلَّذِى خَلَقَ فَسَوَّىٰ","وَٱلَّذِى قَدَّرَ فَهَدَىٰ","وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ","فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ","سَنُقْرِئُكَ فَلَا تَنسَىٰٓ","إِلَّا مَا شَآءَ ٱللَّهُ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ","وَنُيَسِّرُكَ لِلْيُسْرَىٰ","فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ","سَيَذَّكَّرُ مَن يَخْشَىٰ","وَيَتَجَنَّبُهَا ٱلْأَشْقَى","ٱلَّذِى يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ","ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","قَدْ أَفْلَحَ مَن تَزَكَّىٰ","وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ","بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","وَٱلْـَٔاخِرَةُ خَيْرٌ وَأَبْقَىٰٓ","إِنَّ هَٰذَا لَفِى ٱلصُّحُفِ ٱلْأُولَىٰ","صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ"]},{"id":88,"ar":"ٱلْغَاشِيَةِ","fa":"غاشیه","v":["هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَٰشِيَةِ","وُجُوهٌ يَوْمَئِذٍ خَٰشِعَةٌ","عَامِلَةٌ نَّاصِبَةٌ","تَصْلَىٰ نَارًا حَامِيَةً","تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍ","لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ","لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍ","وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ","لِّسَعْيِهَا رَاضِيَةٌ","فِى جَنَّةٍ عَالِيَةٍ","لَّا تَسْمَعُ فِيهَا لَٰغِيَةً","فِيهَا عَيْنٌ جَارِيَةٌ","فِيهَا سُرُرٌ مَّرْفُوعَةٌ","وَأَكْوَابٌ مَّوْضُوعَةٌ","وَنَمَارِقُ مَصْفُوفَةٌ","وَزَرَابِىُّ مَبْثُوثَةٌ","أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ","وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ","وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ","وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ","فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌ","لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ","إِنَّ إِلَيْنَآ إِيَابَهُمْ","ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم"]},{"id":89,"ar":"ٱلْفَجْرِ","fa":"فجر","v":["وَٱلْفَجْرِ","وَلَيَالٍ عَشْرٍ","وَٱلشَّفْعِ وَٱلْوَتْرِ","وَٱلَّيْلِ إِذَا يَسْرِ","هَلْ فِى ذَٰلِكَ قَسَمٌ لِّذِى حِجْرٍ","أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","إِرَمَ ذَاتِ ٱلْعِمَادِ","ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ","وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ","وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ","ٱلَّذِينَ طَغَوْا۟ فِى ٱلْبِلَٰدِ","فَأَكْثَرُوا۟ فِيهَا ٱلْفَسَادَ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ","فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ","وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّىٓ أَهَٰنَنِ","كَلَّا بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ","وَلَا تَحَٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًا لَّمًّا","وَتُحِبُّونَ ٱلْمَالَ حُبًّا جَمًّا","كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّا دَكًّا","وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّا صَفًّا","وَجِا۟ىٓءَ يَوْمَئِذٍۭ بِجَهَنَّمَ يَوْمَئِذٍ يَتَذَكَّرُ ٱلْإِنسَٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ","يَقُولُ يَٰلَيْتَنِى قَدَّمْتُ لِحَيَاتِى","فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌ","وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌ","يَٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ","ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً","فَٱدْخُلِى فِى عِبَٰدِى","وَٱدْخُلِى جَنَّتِى"]},{"id":90,"ar":"ٱلْبَلَدِ","fa":"بلد","v":["لَآ أُقْسِمُ بِهَٰذَا ٱلْبَلَدِ","وَأَنتَ حِلٌّۢ بِهَٰذَا ٱلْبَلَدِ","وَوَالِدٍ وَمَا وَلَدَ","لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِى كَبَدٍ","أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ","يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا","أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ","أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ","وَلِسَانًا وَشَفَتَيْنِ","وَهَدَيْنَٰهُ ٱلنَّجْدَيْنِ","فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ","وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ","فَكُّ رَقَبَةٍ","أَوْ إِطْعَٰمٌ فِى يَوْمٍ ذِى مَسْغَبَةٍ","يَتِيمًا ذَا مَقْرَبَةٍ","أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ","ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَتَوَاصَوْا۟ بِٱلصَّبْرِ وَتَوَاصَوْا۟ بِٱلْمَرْحَمَةِ","أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلْمَيْمَنَةِ","وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا هُمْ أَصْحَٰبُ ٱلْمَشْـَٔمَةِ","عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌۢ"]},{"id":91,"ar":"ٱلشَّمْسِ","fa":"شمس","v":["وَٱلشَّمْسِ وَضُحَىٰهَا","وَٱلْقَمَرِ إِذَا تَلَىٰهَا","وَٱلنَّهَارِ إِذَا جَلَّىٰهَا","وَٱلَّيْلِ إِذَا يَغْشَىٰهَا","وَٱلسَّمَآءِ وَمَا بَنَىٰهَا","وَٱلْأَرْضِ وَمَا طَحَىٰهَا","وَنَفْسٍ وَمَا سَوَّىٰهَا","فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا","قَدْ أَفْلَحَ مَن زَكَّىٰهَا","وَقَدْ خَابَ مَن دَسَّىٰهَا","كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ","إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا","فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا","فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا","وَلَا يَخَافُ عُقْبَٰهَا"]},{"id":92,"ar":"ٱللَّيْلِ","fa":"لیل","v":["وَٱلَّيْلِ إِذَا يَغْشَىٰ","وَٱلنَّهَارِ إِذَا تَجَلَّىٰ","وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ","إِنَّ سَعْيَكُمْ لَشَتَّىٰ","فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ","وَصَدَّقَ بِٱلْحُسْنَىٰ","فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ","وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ","وَكَذَّبَ بِٱلْحُسْنَىٰ","فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ","وَمَا يُغْنِى عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ","إِنَّ عَلَيْنَا لَلْهُدَىٰ","وَإِنَّ لَنَا لَلْـَٔاخِرَةَ وَٱلْأُولَىٰ","فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ","لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى","ٱلَّذِى كَذَّبَ وَتَوَلَّىٰ","وَسَيُجَنَّبُهَا ٱلْأَتْقَى","ٱلَّذِى يُؤْتِى مَالَهُۥ يَتَزَكَّىٰ","وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍ تُجْزَىٰٓ","إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ","وَلَسَوْفَ يَرْضَىٰ"]},{"id":93,"ar":"ٱلضُّحَىٰ","fa":"ضحی","v":["وَٱلضُّحَىٰ","وَٱلَّيْلِ إِذَا سَجَىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","وَلَلْـَٔاخِرَةُ خَيْرٌ لَّكَ مِنَ ٱلْأُولَىٰ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ","أَلَمْ يَجِدْكَ يَتِيمًا فَـَٔاوَىٰ","وَوَجَدَكَ ضَآلًّا فَهَدَىٰ","وَوَجَدَكَ عَآئِلًا فَأَغْنَىٰ","فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ","وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"]},{"id":94,"ar":"ٱلشَّرْحِ","fa":"شرح","v":["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","وَوَضَعْنَا عَنكَ وِزْرَكَ","ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ","وَرَفَعْنَا لَكَ ذِكْرَكَ","فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","فَإِذَا فَرَغْتَ فَٱنصَبْ","وَإِلَىٰ رَبِّكَ فَٱرْغَب"]},{"id":95,"ar":"ٱلتِّينِ","fa":"تین","v":["وَٱلتِّينِ وَٱلزَّيْتُونِ","وَطُورِ سِينِينَ","وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ","لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍ","ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ","إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ","أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ"]},{"id":96,"ar":"ٱلْعَلَقِ","fa":"علق","v":["ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ","ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ","عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ","كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ","أَن رَّءَاهُ ٱسْتَغْنَىٰٓ","إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ","أَرَءَيْتَ ٱلَّذِى يَنْهَىٰ","عَبْدًا إِذَا صَلَّىٰٓ","أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ","أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ","أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ","أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ","كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ","نَاصِيَةٍ كَٰذِبَةٍ خَاطِئَةٍ","فَلْيَدْعُ نَادِيَهُۥ","سَنَدْعُ ٱلزَّبَانِيَةَ","كَلَّا لَا تُطِعْهُ وَٱسْجُدْ وَٱقْتَرِب"]},{"id":97,"ar":"ٱلْقَدْرِ","fa":"قدر","v":["إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ","وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ","لَيْلَةُ ٱلْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ"]},{"id":98,"ar":"ٱلْبَيِّنَةِ","fa":"بینه","v":["لَمْ يَكُنِ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ","رَسُولٌ مِّنَ ٱللَّهِ يَتْلُوا۟ صُحُفًا مُّطَهَّرَةً","فِيهَا كُتُبٌ قَيِّمَةٌ","وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ","وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ","إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ","إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أُو۟لَٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ","جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًا رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ذَٰلِكَ لِمَنْ خَشِىَ رَبَّهُۥ"]},{"id":99,"ar":"ٱلزَّلْزَلَةِ","fa":"زلزال","v":["إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا","وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا","وَقَالَ ٱلْإِنسَٰنُ مَا لَهَا","يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ ","v":["قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ","مَلِكِ ٱلنَّاسِ","إِلَٰهِ ٱلنَّاسِ","مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ","ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ","مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ"]}]</script>
<script>
(function(){
'use strict';

/* ================= data ================= */
var DATA=JSON.parse(document.getElementById('data').textContent);
var SUR={},TOTAL=0;
DATA.forEach(function(s){SUR[s.id]=s;TOTAL+=s.v.length;});

/* ================= helpers ================= */
function $(id){return document.getElementById(id);}
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.charAt(+d);});}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var inViewer=!!(window.claude&&typeof window.claude.use==='function');

/* ================= matching ================= */
function compact(s,daggerAlef){
  s=String(s||'').normalize('NFKC');
  if(daggerAlef)s=s.replace(/ٰ/g,'ا');
  return s
    .replace(/[ـً-ٰٟۖ-ۭ]/g,'')
    .replace(/[آأإٱ]/g,'ا')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .replace(/[ىیے]/g,'ي')
    .replace(/[ةہھە]/g,'ه')
    .replace(/ک/g,'ك')
    .replace(/[^ء-ي]/g,'')
    .replace(/ء/g,'');
}
/* smallest edit distance between pat and any substring of text (Sellers) */
function approx(text,pat){
  var m=pat.length,n=text.length,prev=new Array(n+1),cur,i,j,cost;
  for(j=0;j<=n;j++)prev[j]=0;
  for(i=1;i<=m;i++){
    cur=new Array(n+1);cur[0]=i;
    for(j=1;j<=n;j++){
      cost=pat.charCodeAt(i-1)===text.charCodeAt(j-1)?0:1;
      cur[j]=Math.min(prev[j-1]+cost,prev[j]+1,cur[j-1]+1);
    }
    prev=cur;
  }
  var best=1e9,end=0;
  for(j=0;j<=n;j++){if(prev[j]<best){best=prev[j];end=j;}}
  return {dist:best,end:end};
}
function allowed(t){return Math.floor(t.length*0.22);}
/* compares against two spellings of the verse (superscript alef dropped / written as alef) */
function matchVerse(tail,a,b){
  var ra=approx(tail,a),rb=approx(tail,b);
  var okA=ra.dist<=allowed(a),okB=rb.dist<=allowed(b);
  if(okA&&(!okB||ra.dist<=rb.dist))return {ok:true,end:ra.end};
  if(okB)return {ok:true,end:rb.end};
  return {ok:false,end:0};
}

/* ================= storage ================= */
var KEY='juz30-v1';
var store={p:{},last:0,size:2,t:0,c:{xp:0,streak:0,bestStreak:0,last:'',daily:'',dailyScore:0,perfect:0,bestFree:0,games:0}};
var sizes=[1.4,1.6,1.8,2.0,2.2,2.5];
function loadLocal(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);
      if(o&&o.p&&typeof o.p==='object'){store.p=o.p;store.last=o.last|0;store.t=o.t|0;if(typeof o.size==='number'&&o.size>=0&&o.size<sizes.length)store.size=o.size;}
      if(o&&o.c&&typeof o.c==='object'){for(var ck in o.c){store.c[ck]=o.c[ck];}}}
  }catch(e){}
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function count(id){var n=SUR[id].v.length,k=store.p[id]|0;return Math.max(0,Math.min(n,k));}
function status(id){var k=count(id);return k===0?0:(k>=SUR[id].v.length?2:1);}
function totals(){
  var v=0,done=0,prog=0;
  DATA.forEach(function(s){var k=count(s.id);v+=k;if(k>=s.v.length)done++;else if(k>0)prog++;});
  return {verses:v,done:done,prog:prog,pct:TOTAL?v/TOTAL:0};
}
function touch(){store.t=Date.now();saveLocal();pushCloud();}
function setProgress(id,k){store.p[id]=k;store.last=id;touch();}

/* ---- per-account copy (only inside Claude) ---- */
var cloud={doc:null,busy:false,dirty:false,sent:''};
function pushCloud(){
  if(!cloud.doc)return;
  var body=JSON.stringify({p:store.p,last:store.last,t:store.t});
  if(body===cloud.sent)return;
  if(cloud.busy){cloud.dirty=true;return;}
  cloud.busy=true;cloud.sent=body;
  cloud.doc.set({p:store.p,last:store.last,t:store.t}).then(function(){},function(){}).then(function(){
    cloud.busy=false;
    if(cloud.dirty){cloud.dirty=false;pushCloud();}
  });
}
function initCloud(){
  if(!inViewer)return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return;
    return user.id().then(function(uid){
      if(!uid)return;
      cloud.doc=db.doc('data/users/'+uid+'/progress');
      return cloud.doc.get().then(function(snap){
        var d=snap.exists?snap.data():null;
        if(d&&d.p&&(d.t|0)>store.t){
          store.p=d.p;store.last=d.last|0;store.t=d.t|0;saveLocal();
          cloud.sent=JSON.stringify({p:store.p,last:store.last,t:store.t});
          var rt=route().name;
          if(rt==='home'||rt==='surahs'||rt==='progress'||rt==='read')render(true);
        }else{pushCloud();}
      });
    });
  }).catch(function(){});
}

  return cand||suggestId();
}
function nextIncomplete(after){
  var found=null,i,s;
  for(i=0;i<DATA.length;i++){s=DATA[i];if(s.id>after&&count(s.id)<s.v.length){found=s.id;break;}}
  if(found===null){for(i=0;i<DATA.length;i++){s=DATA[i];if(s.id!==after&&count(s.id)<s.v.length){found=s.id;break;}}}
  return found;
}

function paintRow(i){
  var li=ex.rows[i],slot=li.querySelector('.slot'),st=ex.st[i],cur=(i===ex.idx&&!ex.done);
  li.dataset.state=st==='ok'?'ok':st==='peek'?'peek':st==='known'?'known':(cur?'current':'todo');
  slot.classList.remove('pop');
  if(st==='ok'||st==='peek'||st==='known'){slot.textContent=SUR[ex.id].v[i];}
  else if(cur&&ex.hint){
    slot.textContent='';
    var g=document.createElement('span');g.className='ghost';
    g.textContent=SUR[ex.id].v[i].split(' ').slice(0,2).join(' ')+' …';
    slot.appendChild(g);
  }else{slot.textContent='';}
}
function updateExamHeader(){
  var k=count(ex.id),n=ex.n;
  $('exText').textContent=k===0?'آیه‌ای ثبت نشده':'حفظ‌شده تا آیهٔ '+fa(k)+' از '+fa(n);
  $('exBar').innerHTML=bar(k/n,k>=n);
}
function prefix(){
  var i=0;
  while(i<ex.n&&(ex.st[i]==='known'||(ex.st[i]==='ok'&&!ex.helped[i])))i++;
  return i;
}
function clearBuffers(){ex.finalC='';ex.partialC='';ex.consumed=0;ex.heardF='';ex.heardP='';}
function popRow(i){var slot=ex.rows[i].querySelector('.slot');void slot.offsetWidth;slot.classList.add('pop');}
function shakeRow(i){var li=ex.rows[i];li.classList.remove('shake');void li.offsetWidth;li.classList.add('shake');}

function accept(i,how){
  ex.st[i]=how;ex.hint=false;ex.idx=i+1;
  paintRow(i);popRow(i);
  var pf=prefix();
  if(pf>count(ex.id)){setProgress(ex.id,pf);}
  updateExamHeader();
  if(ex.idx>=ex.n){finishExam();return;}
  paintRow(ex.idx);
  updateExamButtons();
  say(how==='ok'?'درست بود! آیهٔ '+fa(ex.idx+1)+' را بخوان.':'آیهٔ '+fa(ex.idx+1)+' را بخوان.',how==='ok'?'ok':'');
  ex.rows[ex.idx].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});
}
function miss(){
  say('درست تشخیص داده نشد. همین آیه را دوباره بخوان.','warn');
  shakeRow(ex.idx);
}
function updateExamButtons(){
  var a=$('hintBtn'),b=$('revealBtn');
  if(a)a.disabled=ex.done||ex.hint;
  if(b)b.disabled=ex.done;
}
function finishExam(){
  ex.done=true;
  if(engine&&micState!=='idle')engine.stop();
  updateExamButtons();
  var pf=prefix(),s=SUR[ex.id],full=(pf>=ex.n),nid=nextIncomplete(ex.id);
  $('doneTitle').textContent=full?'آفرین! '+sname(s)+' کامل شد.':'آزمون تمام شد.';
  $('doneText').textContent=full?'همهٔ آیه‌ها را بدون کمک خواندی.':'تا آیهٔ '+fa(count(ex.id))+' بدون کمک خوانده‌ای. آیه‌هایی که کمک گرفتی را دوباره امتحان کن.';
  var a='<a class="btn primary" href="#exam-'+ex.id+'" data-act="again">امتحان دوباره</a>';
  if(nid)a+='<a class="btn" href="#read-'+nid+'">سورهٔ بعدی: '+esc(SUR[nid].fa)+'</a>';
  a+='<a class="btn" href="#surahs">همهٔ سوره‌ها</a>';
  $('doneActs').innerHTML=a;
  $('done').hidden=false;$('tray').hidden=true;
  $('done').scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});

/* ---- recognition input ---- */
function showHeard(){
  var el=$('heard');if(!el||!ex)return;
  var t=(ex.heardF+ex.heardP).replace(/\s+/g,' ').trim();
  el.textContent=t.length>90?'…'+t.slice(-90):t;
}
function onPartial(text){if(!ex||ex.done)return;ex.partialC=compact(text);ex.heardP=text;showHeard();evaluate();}
function onFinal(text){if(!ex||ex.done)return;ex.finalC+=compact(text);ex.heardF+=text;ex.partialC='';ex.heardP='';showHeard();evaluate();}
function evaluate(){
  var guard=0;
  while(ex&&!ex.done&&guard++<ex.n){
    var combined=ex.finalC+ex.partialC;
    if(ex.consumed>combined.length)ex.consumed=combined.length;
    var tail=combined.slice(ex.consumed),a=ex.tA[ex.idx],b=ex.tB[ex.idx];
    if(tail.length<Math.ceil(Math.min(a.length,b.length)*0.6))return;
    var r=matchVerse(tail,a,b);
    if(r.ok){ex.consumed+=r.end;accept(ex.idx,'ok');continue;}
    if(tail.length>Math.max(a.length,b.length)*1.5+6){ex.consumed=combined.length;miss();}
    return;
  }
}

  if(probing)return 'در حال آماده‌سازی میکروفون…';

var ERR={

  rate_limited:'درخواست‌ها زیاد بود. کمی بعد دوباره امتحان کن.',

var MSG_LANG='تشخیص گفتارِ عربی در دسترس نیست. دوباره دکمه را بزن تا با زبان پیش‌فرض گوش کنم؛ دقتش کمتر است.';
function paintMic(s){
  micState=(s==='listening')?'on':(s==='starting'||s==='finishing')?'wait':'idle';

  m.dataset.state=micState;
  m.setAttribute('aria-pressed',micState==='on'?'true':'false');
  m.setAttribute('aria-label',micState==='idle'?'شروع شنیدن':'توقف');

function setListening(s,reason){

function endWith(reason){
  var now=Date.now();
  if(reason){if(lastEnd.r===reason&&now-lastEnd.t<600)return;}
  else if(lastEnd.r&&ERR[lastEnd.r]&&now-lastEnd.t<1500){paintMic('idle');return;}
  if(reason)lastEnd={r:reason,t:now};
  paintMic('idle');
  if(!ex||ex.done)return;
  var det=detail?' ('+detail+')':'';
  if((reason==='unavailable'||reason==='upstream_error')&&engine&&engine.kind==='dictation'&&dictLang){dictLang='';say(MSG_LANG+det,'warn');return;}
  if(reason&&ERR[reason]){
    say(ERR[reason]+(reason==='upstream_error'?det:''),'warn');

function maybeGate(){
  try{

function askMic(){

/* ---- engines ---- */
function dictationEngine(d){
  d.onPartial(function(e){onPartial((e&&e.text)||'');});
  d.onFinal(function(e){onFinal((e&&e.text)||'');});
  d.onState(function(e){setListening(e.state,e.reason);});
  return {kind:'dictation',
    start:function(){
      var p;
      try{p=d.start(dictLang?{language:dictLang}:undefined);}catch(err){endWith('upstream_error');return;}
      p.catch(function(err){
        detail=(((err&&err.code)||'')+' '+((err&&err.message)||'')).trim().slice(0,90);
        var el=$('status');
        if(el&&el.dataset.tone==='warn'&&detail&&el.textContent.indexOf(detail)<0)el.textContent+=' ('+detail+')';
        endWith((err&&err.code)||'upstream_error');
      });
    },
    stop:function(){d.stop().catch(function(){});}
  };
}
function speechEngine(SR){
  var r=new SR(),wanted=false;
  r.lang='ar-SA';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  r.onstart=function(){setListening('listening');};
  r.onresult=function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res=e.results[i];
      if(res.isFinal)onFinal(' '+res[0].transcript);else interim+=res[0].transcript;
    }
    if(interim)onPartial(interim);
  };
  r.onerror=function(e){
    var c=e.error;if(c==='no-speech'||c==='aborted')return;
    wanted=false;detail='speech: '+c;
    endWith(c==='not-allowed'||c==='service-not-allowed'?'not_granted':c==='language-not-supported'?'unavailable':'upstream_error');
  };
  r.onend=function(){
    if(wanted){try{r.start();}catch(err){wanted=false;setListening('idle');}}
    else setListening('idle');
  };
  return {kind:'speech',
    start:function(){wanted=true;setListening('starting');try{r.start();}catch(err){}},
    stop:function(){wanted=false;try{r.stop();}catch(err){}}
  };
}
function setEngine(e){
  engine=e;
  var m=$('mic');if(m)m.disabled=!e;
}
function finishProbe(d){
  probing=false;
  if(d&&!engine){
    setEngine(dictationEngine(d));
    try{
      window.claude.use('permissions').then(function(p){
        if(!p)return;
        return p.state('dictation').then(function(s){if(s==='prompt')showGate();});
      }).catch(function(){});
    }catch(err){}
  }
  if(!engine)openTyped();
  if(ex&&micState==='idle')say(idleMessage());
}

/* ================= v2: challenge engine ================= */
var LV=[0,100,250,500,900,1500,2400],LN=['تازه‌کار','نوجو','دانش‌آموز','حافظ‌جو','حافظ ماهر','استاد حفظ','پیشکسوت'];
function level(xp){
  var i=0;while(i+1<LV.length&&xp>=LV[i+1])i++;
  var nx=LV[i+1];
  return {i:i,name:LN[i],from:LV[i],to:(nx===undefined?null:nx)};
}
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function yesterdayKey(){var d=new Date();d.setDate(d.getDate()-1);return dayKey(d);}
function pickOne(arr,R){return arr[Math.floor(R()*arr.length)];}
function shuffle(a,R){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(R()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
var TXTN={};DATA.forEach(function(s){s.v.forEach(function(v){TXTN[v]=(TXTN[v]||0)+1;});});
function uniq(v){return TXTN[v]===1;}
function sname2(s){return s.id===1?'سورهٔ حمد':'سورهٔ '+s.fa;}
function wordsOf(v){return v.split(' ');}
function poolItems(scope){
  var out=[];
  DATA.forEach(function(s){
    var k=(scope==='mem')?count(s.id):s.v.length;
    for(var i=0;i<k;i++)out.push({s:s,i:i,k:k});
  });
  return out;
}
/* distractor texts near the answer's length */
function nearTexts(texts,answer,keyFn,R,n){
  var seen={},list=[];
  texts.forEach(function(t){var k=keyFn(t);if(k===keyFn(answer)||seen[k])return;seen[k]=1;list.push(t);});
  list.sort(function(a,b){return Math.abs(keyFn(a).length-keyFn(answer).length)-Math.abs(keyFn(b).length-keyFn(answer).length)||(R()-0.5);});
  var out=shuffle(list.slice(0,Math.max(n*3,9)),R).slice(0,n);
  return out.length===n?out:null;
}
function mk(prompt,text,opts,correctText,optAr,info,infoAr){
  return {prompt:prompt,text:text,opts:opts,correct:opts.indexOf(correctText),optAr:optAr,info:info,infoAr:infoAr||''};
}
function makeQ(type,pool,R){
  var cand,it,v,ans,ds,opts,j;
  if(type==='next'){
    cand=pool.filter(function(x){return x.i+1<x.k&&uniq(x.s.v[x.i])&&uniq(x.s.v[x.i+1]);});
    if(!cand.length)return null;
    it=pickOne(cand,R);v=it.s.v[it.i];ans=it.s.v[it.i+1];
    ds=nearTexts(pool.filter(function(x){return uniq(x.s.v[x.i])&&x.s.v[x.i]!==v;}).map(function(x){return x.s.v[x.i];}),ans,compact,R,3);
    if(!ds)return null;
    opts=shuffle([ans].concat(ds),R);
    return mk('آیهٔ بعدی کدام است؟',v,opts,ans,true,sname2(it.s)+'، آیهٔ '+fa(it.i+2),ans);
  }
  if(type==='blank'){
    cand=pool.filter(function(x){var t=x.s.v[x.i];return uniq(t)&&wordsOf(t).length>=4;});
    if(!cand.length)return null;
    it=pickOne(cand,R);v=it.s.v[it.i];
    var ws=wordsOf(v),idxs=[];
    ws.forEach(function(w,k){if(k>0&&compact(w).length>=3)idxs.push(k);});
    if(!idxs.length)return null;
    j=pickOne(idxs,R);ans=ws[j];
    var inVerse={};ws.forEach(function(w){inVerse[compact(w)]=1;});
    var allW=[];
    pool.forEach(function(x){wordsOf(x.s.v[x.i]).forEach(function(w){var c=compact(w);if(c.length>=2&&!inVerse[c])allW.push(w);});});
    ds=nearTexts(allW,ans,compact,R,3);
    if(!ds)return null;
    opts=shuffle([ans].concat(ds),R);
    var shown=ws.slice();shown[j]='_____';
    return mk('کلمهٔ جا افتاده کدام است؟',shown.join(' '),opts,ans,true,sname2(it.s)+'، آیهٔ '+fa(it.i+1),v);
  }
  if(type==='surah'){
    cand=pool.filter(function(x){return uniq(x.s.v[x.i]);});
    if(!cand.length)return null;
    it=pickOne(cand,R);v=it.s.v[it.i];
    var others=shuffle(DATA.filter(function(s){return s.id!==it.s.id;}),R).slice(0,3);
    var names=shuffle([it.s].concat(others),R).map(sname2);
    return mk('این آیه از کدام سوره است؟',v,names,sname2(it.s),false,sname2(it.s)+'، آیهٔ '+fa(it.i+1),v);
  }
  if(type==='first'){
    cand=pool.filter(function(x){return x.i===0&&uniq(x.s.v[0]);});
    if(!cand.length)return null;
    it=pickOne(cand,R);ans=it.s.v[0];
    ds=shuffle(DATA.filter(function(s){return s.id!==it.s.id&&uniq(s.v[0]);}),R).slice(0,3).map(function(s){return s.v[0];});
    opts=shuffle([ans].concat(ds),R);
    return mk('اولین آیهٔ «'+sname2(it.s)+'» کدام است؟','',opts,ans,true,sname2(it.s)+'، آیهٔ ۱',ans);
  }
  return null;
}
function drawQ(st){
  var q=null,tries=0;
  while(!q&&tries++<8){
    if(!st.types.length)st.types=shuffle(['surah','next','blank','first','next','blank'],st.R);
    q=makeQ(st.types.pop(),st.pool,st.R);
  }
  return q||makeQ('surah',st.pool,st.R);
}

function startTimer(){

function answer(k){
  if(!ch||ch.locked)return;
  ch.locked=true;clearInterval(ch.timer);
  var q=ch.q,ok=(k===q.correct),left=Math.max(0,ch.limit-(Date.now()-ch.t0)/1000),pts=0;
  if(ok){
    ch.combo++;ch.correct++;
    pts=10+Math.round(left/ch.limit*5)+Math.min(Math.max(ch.combo-2,0),5);
    ch.score+=pts;
  }else{
    ch.combo=0;ch.wrong++;
    if(ch.mode==='free')ch.lives--;
  }
  [].forEach.call(document.querySelectorAll('#opts .opt'),function(b,i){
    b.disabled=true;
    if(i===q.correct)b.classList.add('good');else if(i===k)b.classList.add('bad');
  });
  var fb=$('fb');fb.hidden=false;fb.dataset.ok=ok?'1':'0';
  fb.innerHTML='<p class="fbt">'+(ok?'درست بود! +'+fa(pts)+' امتیاز'+(ch.combo>=3?'، '+fa(ch.combo)+' پیاپی':''):(k<0?'وقت تمام شد.':'نادرست بود.'))+'</p>'
    +'<p class="fbi">'+esc(q.info)+'</p>'
    +(q.infoAr?'<div class="fbar" lang="ar" dir="rtl">'+esc(q.infoAr)+'</div>':'')
    +'<button type="button" class="btn primary block" data-ch="next">'+(hasMore()?'ادامه':'نتیجه')+'</button>';
  var sc=$('scoreChip');if(sc)sc.innerHTML=IC.bolt+fa(ch.score);
  var hr=$('hearts');if(hr)hr.innerHTML=heartsHTML();
  if(!ok&&navigator.vibrate){try{navigator.vibrate(60);}catch(e){}}
  fb.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
}
function confetti(){
  if(reduce)return;
  var d=document.createElement('div');d.className='confetti';d.setAttribute('aria-hidden','true');
  var h='';
  for(var i=0;i<28;i++){
    h+='<i style="left:'+Math.round(Math.random()*100)+'%;background:hsl('+HUES[i%HUES.length]+' 85% 55%);animation-delay:'+(Math.random()*0.9).toFixed(2)+'s;animation-duration:'+(2.2+Math.random()*1.4).toFixed(2)+'s"></i>';
  }

function finishChallenge(){
  clearInterval(ch.timer);
  var c=store.c,gain=0,stars=0,title,lvBefore=level(ch.xpBefore);
  if(ch.mode==='daily'){
    gain=ch.correct*10+(ch.correct===ch.total?20:0);
    stars=ch.correct===5?3:ch.correct===4?2:ch.correct===3?1:0;
    c.streak=(c.last===yesterdayKey())?((c.streak|0)+1):1;
    c.last=dayKey();c.daily=dayKey();c.dailyScore=ch.correct;
    if(c.streak>(c.bestStreak|0))c.bestStreak=c.streak;
    if(ch.correct===ch.total)c.perfect=(c.perfect|0)+1;
  }else{
    gain=Math.floor(ch.score/5);
    stars=ch.score>=150?3:ch.score>=80?2:ch.score>=30?1:0;
    if(ch.score>(c.bestFree|0))c.bestFree=ch.score;
  }
  c.xp=(c.xp|0)+gain;c.games=(c.games|0)+1;
  touch();
  var lvAfter=level(c.xp);
  title=stars===3?'عالی بود!':stars===2?'خیلی خوب!':stars===1?'بد نبود!':'دوباره تلاش کن';
  var h='<div class="res"><h1>'+title+'</h1><div class="stars">'+bigStar(stars>=1)+bigStar(stars>=2)+bigStar(stars>=3)+'</div>';
  if(lvAfter.i>lvBefore.i)h+='<div class="lvup">به سطح «'+esc(lvAfter.name)+'» رسیدی!</div>';

    +'<div><b>'+fa(ch.mode==='daily'?ch.correct*10:ch.score)+'</b><span>'+(ch.mode==='daily'?'امتیاز پاسخ‌ها':'امتیاز')+'</span></div>'
    +'<div><b>+'+fa(gain)+'</b><span>تجربه (XP)</span></div></div>';
  if(ch.mode==='daily')h+='<p class="muted">'+fa(curStreak())+' روز پیاپی. فردا چالش جدید می‌آید.</p>';
  else h+='<p class="muted">رکورد تو: '+fa(c.bestFree|0)+' امتیاز</p>';

  $('play').innerHTML=h;

}

var page=$('page'),wrap=$('wrap'),nav=$('nav');
function route(){
  var h=(location.hash||'').slice(1),m=/^(read|exam|continue)-(\d+)$/.exec(h);
  if(m&&SUR[m[2]])return {name:m[1],id:+m[2]};

  var pm=/^play-(daily|free)$/.exec(h);if(pm)return {name:'play',mode:pm[1]};

function render(keepScroll){

  else if(act==='bigger'){if(store.size<sizes.length-1){store.size++;saveLocal();render(true);}}

  else if(act==='resetAllAsk'){resetConfirm(box,'resetAllYes','resetNo','پیشرفت همهٔ سوره‌ها پاک شود؟ این کار برگشت ندارد.');}
  else if(act==='resetAllYes'){store.p={};store.last=0;touch();render(true);}

    if(!ex||ex.done||ex.hint)return;
    ex.hint=true;ex.helped[ex.idx]=true;paintRow(ex.idx);updateExamButtons();
  }else if(act==='reveal'){
    if(!ex||ex.done)return;
    ex.helped[ex.idx]=true;ex.consumed=(ex.finalC+ex.partialC).length;
    accept(ex.idx,'peek');
  }else if(act==='mic'){

    clearBuffers();var h=$('heard');if(h)h.textContent='';micNote='';

    if(open)$('typed').focus();
  }else if(act==='again'){
    if(location.hash==='#exam-'+(ex&&ex.id)){e.preventDefault();render(false);}
  }

  }else{miss();}
});

<script>
(function(){
  var deferred=null,shown=false,bar=null,fallbackTimer=null;
  var KEY='juz30-install',COOLDOWN=3*24*3600*1000;
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  var ua=navigator.userAgent||'';
  var ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var android=/android/i.test(ua);
  function $(id){return document.getElementById(id);}

  /* ---- reminder memory ---- */
  function snoozed(){
    try{var o=JSON.parse(localStorage.getItem(KEY)||'null');return !!(o&&o.t&&Date.now()-o.t<COOLDOWN);}catch(e){return false;}
  }
  function snooze(){try{localStorage.setItem(KEY,JSON.stringify({t:Date.now()}));}catch(e){}}

  /* ---- where the bar may appear ---- */
  function inExam(){return /^#(exam-|continue-|play-)/.test(location.hash);}
  function gateOpen(){var g=$('gate');return !!(g&&!g.hidden);}
  function canShow(){return !standalone&&!snoozed()&&!inExam()&&!gateOpen();}

  function removeBar(){if(bar&&bar.parentNode)bar.parentNode.removeChild(bar);bar=null;shown=false;}

  function mode(){
    if(deferred)return 'prompt';
    if(ios)return 'ios';
    if(android&&fallbackReady)return 'manual';
    return '';
  }
  var fallbackReady=false;

  function build(m){
    var title='برنامه را روی گوشی نصب کن';
    var text,btns;
    if(m==='prompt'){
      text='آیکونش به صفحهٔ گوشی اضافه می‌شود و بدون اینترنت هم باز می‌شود.';
      btns='<button type="button" class="btn primary" data-i="install">نصب برنامه</button><button type="button" class="btn" data-i="later">بعداً</button>';
    }else if(m==='ios'){
      text='در سافاری دکمهٔ اشتراک‌گذاری (مربع با فلش رو به بالا) را بزن و «Add to Home Screen» را انتخاب کن.';
      btns='<button type="button" class="btn primary" data-i="later">متوجه شدم</button>';
    }else{
      text='منوی سه‌نقطهٔ کروم (بالای صفحه) را باز کن و «Install app» یا «Add to Home screen» را بزن.';
      btns='<button type="button" class="btn primary" data-i="later">متوجه شدم</button>';
    }
    var d=document.createElement('div');
    d.className='ibar';d.setAttribute('dir','rtl');d.setAttribute('lang','fa');
    d.innerHTML='<div class="ibar-card" role="dialog" aria-labelledby="ibTitle"><div class="ibar-head"><img src="icons/icon-192.png" alt="" width="48" height="48">'
      +'<div><b id="ibTitle">'+title+'</b><span>'+text+'</span></div></div><div class="ibar-acts">'+btns+'</div></div>';
    d.addEventListener('click',function(e){
      var t=e.target.closest('[data-i]');if(!t)return;
      var a=t.getAttribute('data-i');
      if(a==='install'&&deferred){
        var ev=deferred;deferred=null;removeBar();
        try{ev.prompt();if(ev.userChoice)ev.userChoice.then(function(c){if(!c||c.outcome!=='accepted')snooze();});}catch(err){snooze();}
      }else{snooze();removeBar();}
    });
    return d;
  }

  function sync(){
    var m=mode();
    if(!canShow()||!m){if(shown&&!canShow())removeBar();return;}
    if(shown)return;
    bar=build(m);document.body.appendChild(bar);shown=true;
  }

  /* ---- home-page card (stays as a permanent entry point) ---- */
  function fill(){
    var box=$('installBox');
    if(!box||standalone){return;}
    if(deferred){
      box.innerHTML='<div class="install card"><p>می‌توانی این برنامه را روی گوشی نصب کنی و بدون اینترنت هم از آن استفاده کنی.</p><button type="button" class="btn primary block" id="installBtn">نصب برنامه</button></div>';
      $('installBtn').addEventListener('click',function(){
        var d=deferred;deferred=null;fill();removeBar();
        try{d.prompt();}catch(e){}
      });
    }else if(ios){
      box.innerHTML='<div class="install card"><p>برای نصب در سافاری: دکمهٔ اشتراک‌گذاری را بزن و «Add to Home Screen» را انتخاب کن.</p></div>';
    }else{box.innerHTML='';}
  }
  window.__installHook=fill;

  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;fill();sync();});
  window.addEventListener('appinstalled',function(){deferred=null;standalone=true;snooze();removeBar();fill();});
  window.addEventListener('hashchange',function(){sync();});

  /* wait until the microphone dialog is closed, then show the install bar */
  var g=$('gate');
  if(g&&window.MutationObserver){new MutationObserver(function(){setTimeout(sync,350);}).observe(g,{attributes:true,attributeFilter:['hidden']});}

  /* Android Chrome that never sends the install event (already installed or unsupported): one manual hint */
  fallbackTimer=setTimeout(function(){fallbackReady=true;sync();},6000);

  setTimeout(sync,1200);

  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
})();
</script>
